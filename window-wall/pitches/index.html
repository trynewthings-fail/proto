<!doctype html><html lang="sv"><head></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fönsterlabbet</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;0,900;1,400;1,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one stage (the 12 panes, as an image or in 3D) beside a hardware-like controller box; stacks below 900px.
   Look: trynewthings.fail, lime on black, Alegreya for voice, Plex Mono for data. One committed dark look. */
:root{
  --ink:#0a0b09; --deck:#121410; --deck2:#1a1d17; --rule:#2b2f26; --fg:#eef1e4; --mut:#959b89; --dim:#5d6356;
  --lime:#CAFE03; --pink:#ff4fa3; --cyan:#2fd6e0; --amber:#ffb21e; --violet:#7b93ff;
  --s:#2fd6e0; --t:#7b93ff; --e:#ffb21e; --a:#ff4fa3; --m:#cafe03;
  --serif:'Alegreya',Georgia,'Times New Roman',serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font:15px/1.45 var(--serif);margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{max-width:1680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
.brand b{display:block;font-size:24px;font-weight:900;letter-spacing:-.01em;line-height:1}
.brand span{display:block;font:12px/1.3 var(--mono);color:var(--mut);letter-spacing:.04em;margin-top:3px}
.lang{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden;flex:none}
.lang button{background:none;border:0;padding:6px 12px;font:600 12px var(--mono);color:var(--mut);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--lime);color:#000}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.tab{display:flex;align-items:center;gap:10px;background:var(--deck);border:1px solid var(--rule);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:left;min-width:0;transition:border-color .15s,background .15s}
.tab:hover{border-color:#444a3c}
.tab .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);color:#000;background:var(--c,var(--lime))}
.tab .nm{min-width:0}
.tab .nm b{display:block;font-size:17px;font-weight:800;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .nm small{display:block;font:11px var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab[aria-selected=true]{background:var(--deck2);border-color:var(--c,var(--lime));box-shadow:inset 0 -3px 0 var(--c,var(--lime))}
.main{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:12px;align-items:start}
.stagewrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.stagebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--deck);border:1px solid var(--rule);border-radius:999px;padding:3px;gap:2px}
.seg button{background:none;border:0;border-radius:999px;padding:5px 12px;font:500 12px var(--mono);color:var(--mut);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--fg);color:#000}
.hud{flex:1;min-width:0;display:flex;justify-content:flex-end}
.hud span{background:var(--lime);color:#000;font:600 12px var(--mono);border-radius:999px;padding:5px 12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:var(--deck);border:1px solid var(--rule);border-radius:999px;width:32px;height:30px;display:grid;place-items:center;cursor:pointer;color:var(--mut)}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stage{position:relative;aspect-ratio:1.68;max-width:100%;background:#000;border-radius:14px;overflow:hidden;border:1px solid var(--rule);touch-action:none}
.stage:fullscreen{border-radius:0;aspect-ratio:auto}
.stage canvas,.stage #v3{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage #v3 canvas{width:100%!important;height:100%!important}
.tip{position:absolute;left:12px;bottom:10px;font:11px var(--mono);color:rgba(238,241,228,.55);pointer-events:none;letter-spacing:.03em}
.pitch{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;background:var(--deck);border:1px solid var(--rule);border-radius:14px;padding:16px 18px}
.pitch h2{margin:0 0 2px;font-size:28px;font-weight:900;line-height:1.05;text-wrap:balance}
.pitch .q{font-style:italic;font-size:19px;color:var(--c,var(--lime));margin:0 0 10px;text-wrap:balance}
.pitch p{margin:0 0 8px;max-width:62ch}
.steps{display:grid;gap:6px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:8px;counter-increment:s;align-items:start}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;border:1.5px solid var(--c,var(--lime));display:grid;place-items:center;font:600 11px var(--mono);color:var(--c,var(--lime));margin-top:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px;font:12px var(--mono);color:var(--fg);background:#0e100c}
.chip svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip.fake{border-color:#5a4a14;color:var(--amber)}
.lbl{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 6px}
.panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.pbox{background:linear-gradient(180deg,#171a14,#10120e);border:1px solid var(--rule);border-radius:16px;padding:12px 14px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.ph b{font:600 12px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.ph small{font:11px var(--mono);color:var(--dim)}
.ph .led{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);display:inline-block;margin-right:7px}
.cg{border-top:1px solid var(--rule);padding:9px 0 4px}
.cg:first-child{border-top:0;padding-top:0}
.cg-t{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.cg-b{display:flex;flex-direction:column;gap:9px}
.cg-b.row{flex-direction:row;flex-wrap:wrap;gap:6px}
.cg-b.knobs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.ctl span{font:500 12px var(--mono);color:var(--fg)}
.ctl output{font:600 12px var(--mono);color:var(--lime);font-variant-numeric:tabular-nums}
.ctl input{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--lime) var(--p,50%),#2a2e25 var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:6px;background:#2a2e25}
input[type=range]::-moz-range-progress{height:6px;border-radius:6px;background:var(--lime)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:26px;border-radius:5px;background:linear-gradient(180deg,#f3f5ea,#b9bdaf);border:1px solid #000;margin-top:-10px;box-shadow:0 2px 4px rgba(0,0,0,.6),inset 0 -6px 0 rgba(0,0,0,.12)}
input[type=range]::-moz-range-thumb{width:18px;height:26px;border-radius:5px;background:linear-gradient(180deg,#f3f5ea,#b9bdaf);border:1px solid #000}
.btn{background:#22261e;border:1px solid #3a3f33;border-radius:9px;padding:7px 11px;font:600 12px var(--mono);letter-spacing:.04em;cursor:pointer;color:var(--fg);box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.06);transition:transform .05s}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #000}
.btn.hot{background:var(--lime);color:#000;border-color:var(--lime)}
.btn.on{border-color:var(--lime);color:var(--lime)}
.btn.big{flex:1;padding:10px 12px;font-size:13px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:8px;font:500 12px var(--mono);cursor:pointer;background:none;border:0;padding:0;text-align:left;color:var(--fg)}
.tog i{flex:none;width:34px;height:18px;border-radius:9px;background:#2a2e25;position:relative;transition:background .15s}
.tog i::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#cfd3c4;transition:left .15s}
.tog[aria-pressed=true] i{background:var(--lime)}
.tog[aria-pressed=true] i::after{left:18px;background:#000}
.knob{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:ns-resize;user-select:none;touch-action:none}
.knob svg{width:100%;max-width:62px;aspect-ratio:1;overflow:visible}
.knob b{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--fg)}
.knob output{font:500 10.5px var(--mono);color:var(--lime);font-variant-numeric:tabular-nums}
.sgrp{display:flex;flex-wrap:wrap;gap:4px}
.sgrp button{flex:1;background:#1b1e17;border:1px solid #363a30;border-radius:8px;padding:6px 6px;font:500 11.5px var(--mono);cursor:pointer;color:var(--mut);white-space:nowrap}
.sgrp button[aria-pressed=true]{border-color:var(--lime);color:#000;background:var(--lime)}
.pad{width:100%;display:block;border-radius:10px;border:1px solid #3a3f33;background:#060705;touch-action:none;cursor:crosshair}
.ro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.ro div{background:#0b0c0a;border:1px solid #262a21;border-radius:9px;padding:6px 9px;min-width:0}
.ro small{display:block;font:10.5px var(--mono);color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.ro b{display:block;font:600 15px var(--mono);color:var(--lime);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note{font:11.5px/1.45 var(--mono);color:var(--mut);margin:0}
.note.fake{color:var(--amber)}
#plaza{width:100%;display:block;border-radius:10px;border:1px solid #3a3f33;background:#070806;touch-action:none;cursor:grab}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
  .tab{flex-direction:column;align-items:flex-start;gap:4px;padding:8px}
  .tab .nm small{display:none}
  .tab .nm b{font-size:13px}
  .pitch{grid-template-columns:minmax(0,1fr)}
  .stagewrap{display:contents}
  .stagebar{order:1}.stage{order:2}.panel{order:3}.pitch{order:4}
}
@media (max-width:520px){
  .tab .num{width:22px;height:22px;font-size:11px}
  .tab .nm b{font-size:11.5px}
  .brand b{font-size:20px}
  .pitch h2{font-size:23px}
  .tip{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ---- 10-core.js ---- */
/* ================= Core: language, façade geometry, maths, drawing helpers ================= */
let LANG='sv';
try{const l=localStorage.getItem('fl-lang');if(l==='en'||l==='sv')LANG=l;}catch(e){}
const L=o=>o==null?'':(typeof o==='object'&&!Array.isArray(o))?(o[LANG]??o.sv??''):o;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Façade in metres, measured from the photo. x = 0 at the left unit's outer edge, y = 0 at the windows' top, y grows down.
   Each unit: frame 0.08 · 3 panes 0.60 · 2 mullions 0.14 · transom 0.19 · top row 1.48 · bottom row 1.28. Pier 0.75. */
const F=(()=>{
  const K=0.08,PW=0.60,MU=0.14,TR=0.19,PIER=0.75,HT=1.48,HB=1.28;
  const UW=K*2+PW*3+MU*2,H=K*2+HT+TR+HB,W=UW*2+PIER;
  const units=[0,UW+PIER].map((x0,u)=>({u,x0,x1:x0+UW,ix0:x0+K,ix1:x0+UW-K,cx:x0+UW/2}));
  const rows=[{y:K,h:HT},{y:K+HT+TR,h:HB}];
  const panes=[];
  for(let r=0;r<2;r++)for(let c=0;c<6;c++){
    const u=c<3?0:1,k=c%3,x=units[u].x0+K+k*(PW+MU);
    panes.push({i:r*6+c,c,r,u,k,x,y:rows[r].y,w:PW,h:rows[r].h,cx:x+PW/2,cy:rows[r].y+rows[r].h/2});
  }
  const cols=[0,1,2,3,4,5].map(c=>({c,x:panes[c].x,w:PW,cx:panes[c].cx}));
  return {K,PW,MU,TR,PIER,HT,HB,UW,H,W,units,rows,panes,cols,SILL:0.75,
    top:K,bot:H-K,trY0:K+HT,trY1:K+HT+TR,pierX0:UW,pierX1:UW+PIER,
    pane:(c,r)=>panes[r*6+c],
    colAt(x){let b=0,d=1e9;for(const c of cols){const e=Math.abs(c.cx-x);if(e<d){d=e;b=c.c;}}return b;}};
})();

const PPM=300;                                   // screen canvas pixels per metre
const scr=document.createElement('canvas');
scr.width=Math.round(F.W*PPM);scr.height=Math.round(F.H*PPM);
const g=scr.getContext('2d');

/* maths */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,v)=>{const t=clamp((v-a)/(b-a));return t*t*(3-2*t);};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const approach=(v,target,rate,dt)=>v+(target-v)*(1-Math.exp(-rate*dt));
const TAU=Math.PI*2;
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}
function hash2(x,y){return hash(x*157.31+y*913.77);}
function noise2(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi),b=hash2(xi+1,yi),c=hash2(xi,yi+1),d=hash2(xi+1,yi+1);return lerp(lerp(a,b,u),lerp(c,d,u),v);}
function fbm(x,y,o=5){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*noise2(x*f,y*f);f*=2.03;a*=.5;}return s;}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return(s>>>0)/4294967296;};}

/* colour */
function hexRGB(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[n>>16&255,n>>8&255,n&255];}
function rgba(h,a=1){const[r,g2,b]=hexRGB(h);return`rgba(${r},${g2},${b},${a})`;}
function mix(h1,h2,t){const a=hexRGB(h1),b=hexRGB(h2);return'#'+a.map((v,i)=>Math.round(lerp(v,b[i],clamp(t))).toString(16).padStart(2,'0')).join('');}
function ramp(stops,t){t=clamp(t);for(let i=1;i<stops.length;i++)if(t<=stops[i][0]){const[a,ca]=stops[i-1],[b,cb]=stops[i];return mix(ca,cb,(t-a)/(b-a||1));}return stops[stops.length-1][1];}
const C={lime:'#CAFE03',pink:'#ff4fa3',cyan:'#2fd6e0',amber:'#ffb21e',violet:'#7b93ff',fg:'#eef1e4',ink:'#0a0b09'};

/* text in metres: canvas fonts below 1px get quantised, so draw at ×100 */
function txt(c,s,x,y,size,o={}){
  c.save();c.translate(x,y);c.scale(.01,.01);
  c.font=`${o.italic?'italic ':''}${o.w||700} ${size*100}px ${o.mono?"'IBM Plex Mono',monospace":"Alegreya,Georgia,serif"}`;
  c.textAlign=o.align||'center';c.textBaseline=o.base||'middle';
  if(o.ls)c.letterSpacing=(o.ls*size*100)+'px';
  c.globalAlpha*=o.alpha??1;
  if(o.glow){c.shadowColor=o.glow;c.shadowBlur=o.blur||18;}
  if(o.stroke){c.lineWidth=o.stroke*100;c.strokeStyle=o.strokeCol||'#000';c.lineJoin='round';c.strokeText(s,0,0);}
  c.fillStyle=o.col||C.fg;c.fillText(s,0,0);
  c.restore();
}
function rrect(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function clipPane(c,p,pad=0){c.beginPath();c.rect(p.x-pad,p.y-pad,p.w+pad*2,p.h+pad*2);c.clip();}
function glowDot(c,x,y,r,col,a=1){const gr=c.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(col,a));gr.addColorStop(.25,rgba(col,a*.45));gr.addColorStop(1,rgba(col,0));c.fillStyle=gr;c.fillRect(x-r,y-r,r*2,r*2);}
/* The TNT smiley. happy=false turns it 180° into the sad face. */
function smiley(c,cx,cy,R,happy=true,col=C.lime,lw=0.16){
  c.save();c.translate(cx,cy);if(!happy)c.rotate(Math.PI);
  c.strokeStyle=col;c.fillStyle=col;c.lineWidth=R*lw;c.lineCap='round';
  c.beginPath();c.arc(0,0,R,0,TAU);c.stroke();
  c.beginPath();c.arc(-R*.34,-R*.2,R*.13,0,TAU);c.arc(R*.34,-R*.2,R*.13,0,TAU);c.fill();
  c.beginPath();c.arc(0,R*.02,R*.48,.22*Math.PI,.78*Math.PI);c.stroke();
  c.restore();
}
function clearScr(col='#000'){g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.shadowBlur=0;g.fillStyle=col;g.fillRect(0,0,scr.width,scr.height);g.setTransform(PPM,0,0,PPM,0,0);}

/* Simulated "live" data for the pitch. Deterministic per day and hour, so everyone sees the same numbers. */
const FAKE=(()=>{
  const now=()=>new Date();
  const doy=d=>Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);
  // Skellefteå monthly normals, °C (approx. 1991–2020)
  const NORM=[-9.6,-9.1,-4.8,1.2,7.4,13.2,16.3,14.2,9.1,2.8,-2.9,-7.0];
  function tempAt(d=now()){
    const m=d.getMonth()+(d.getDate()-15)/30,i=Math.floor(m),f=m-i;
    const base=lerp(NORM[(i+12)%12],NORM[(i+13)%12],f);
    const day=doy(d)+d.getFullYear()*400;
    const weather=(noise2(day*.35,3.1)-.5)*9;                       // a few days of warm or cold spells
    const diurnal=Math.cos((d.getHours()+d.getMinutes()/60-15)/24*TAU)*2.4;
    return Math.round((base+weather+diurnal)*10)/10;
  }
  function wind(d=now()){const h=doy(d)*24+d.getHours()+d.getMinutes()/60;return Math.round((3+noise2(h*.07,8.2)*9)*10)/10;}
  function price(d=now()){ // SE1 spot, öre/kWh
    const h=d.getHours()+d.getMinutes()/60,day=doy(d);
    const peak=Math.exp(-Math.pow((h-8.5)/2.2,2))*28+Math.exp(-Math.pow((h-18)/2.6,2))*34;
    return Math.max(4,Math.round(18+peak*(0.6+noise2(day*.5,1.7))+noise2(h*.4,day)*14));
  }
  function production(d=now()){ // Skellefteå Kraft, MW right now
    const w=wind(d),hydro=Math.round(420+noise2(doy(d)*.2,5.5)*260+Math.exp(-Math.pow((d.getHours()-18)/3,2))*120);
    const windMW=Math.round(clamp((w-3)/9)*180*(.7+noise2(w,2)*.3));
    return {hydro,wind:windMW,total:hydro+windMW};
  }
  function kp(d=now()){return Math.round((1+noise2(doy(d)*.8+d.getHours()*.05,9.9)*5)*10)/10;}
  return {tempAt,wind,price,production,kp,now};
})();

/* ================= Art styles: one post-processing pass per tab =================
   Each tab draws its picture on the screen canvas as before; a WebGL shader then turns it into a medium:
     riso    fluorescent risograph inks on black stock: halftone screens, misregistration, grain   (Temperatur)
     poster  mid-century lithograph poster: a few flat inks, paper fibre, uneven ink, offset key  (Elektricitet)
     crt     a TouchDesigner screen: bloom, scanlines, RGB split, every pane its own tube          (Topografi)
     atlas   a hand-coloured copperplate star chart: halation, ink and paper grain                (Stjärnhimlen)
     paper   paper lit from behind like an advent star: fibres, warm hotspot per pane, glow        (Jul)            */
const POST=(()=>{
  const cv=document.createElement('canvas');cv.width=scr.width;cv.height=scr.height;
  const gl=cv.getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false,antialias:false});

  const VS='attribute vec2 p;varying vec2 vUv;void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}';
  const HEAD=`precision highp float;uniform sampler2D uTex;uniform vec2 uRes;uniform float uT;uniform vec4 uPane[12];uniform mat3 uInk;uniform vec3 uPal[8];varying vec2 vUv;
    float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
    float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}
    float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*vn(p);p*=2.03;a*=.5;}return s;}
    vec3 tx(vec2 uv){return texture2D(uTex,uv).rgb;}
    float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
    vec4 pane(vec2 uv){for(int i=0;i<12;i++){vec4 r=uPane[i];if(uv.x>=r.x&&uv.x<=r.x+r.z&&uv.y>=r.y&&uv.y<=r.y+r.w)return r;}return vec4(-1.);}
    float dots(vec2 px,float amt,float ang,float cell){float c=cos(ang),s=sin(ang);vec2 q=mat2(c,-s,s,c)*px;vec2 f=mod(q,cell)-cell*.5;float r=sqrt(clamp(amt,0.,1.))*cell*.74;return smoothstep(r+.9,r-.9,length(f));}`;
  const FS={
    riso:`void main(){vec2 px=vUv*uRes,o=1./uRes;
      vec3 a0=uInk*tx(vUv+o*vec2(1.6,-.8)),a1=uInk*tx(vUv+o*vec2(-1.2,1.)),a2=uInk*tx(vUv);
      float grain=vn(px*.9);

      float p=dots(px,A.x*(.9+.2*grain),.26,6.),b=dots(px,A.y*(.9+.2*grain),1.31,6.),y=dots(px,A.z,.79,6.);
      vec3 P=vec3(1.,.28,.62),B=vec3(.05,.5,.95),Y=vec3(1.,.9,.1);
      vec3 c=1.-(1.-P*p*(.85+.15*vn(px*.35)))*(1.-B*b*(.85+.15*vn(px*.31+7.)))*(1.-Y*y*(.85+.15*vn(px*.33+3.)));
      c+=vec3(.035,.03,.04)*fbm(px*.02);c*=.94+.06*h21(px);gl_FragColor=vec4(c,1.);}`,
    poster:`void main(){vec2 px=vUv*uRes,o=1./uRes;
      vec3 c=tx(vUv+o*(vn(px*.03)-.5)*1.5);float j=(fbm(px*.045)-.5)*.09;c+=j;
      float best=1e9;vec3 q=uPal[0];for(int i=0;i<8;i++){vec3 d=(c-uPal[i])*vec3(.9,1.2,.8);float e=dot(d,d);if(e<best){best=e;q=uPal[i];}}

    crt:`void main(){vec2 px=vUv*uRes,o=1./uRes;vec4 r=pane(vUv);
      vec3 c=vec3(tx(vUv+o*vec2(1.3,0)).r,tx(vUv).g,tx(vUv-o*vec2(1.3,0)).b);

    atlas:`void main(){vec2 px=vUv*uRes,o=1./uRes;vec3 c=tx(vUv);

    paper:`void main(){vec2 px=vUv*uRes,o=1./uRes;vec3 c=tx(vUv);vec4 r=pane(vUv);
      vec3 bl=vec3(0.);for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 d=vec2(cos(a),sin(a));bl+=max(tx(vUv+d*o*9.)-.55,0.)+max(tx(vUv+d*o*22.)-.55,0.)*.7;}

  const progs={};

  const inv=(()=>{const P=[1,.28,.62],B=[.05,.5,.95],Y=[1,.9,.1],m=[P[0],B[0],Y[0],P[1],B[1],Y[1],P[2],B[2],Y[2]];

/* ================= UI kit: the web controller that stands in for the cameras while we pitch =================
   Every control reads its start value from the idea's state object and writes straight back to it,
   so the panel can be rebuilt at any time (language switch) without losing anything. */
const UI=(()=>{
  let root,cur,uid=0;
  const mk=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
  function begin(el){root=el;root.innerHTML='';cur=null;uid=0;}
  function group(title,cls){const w=mk('div','cg');if(title)w.append(mk('div','cg-t',esc(L(title))));cur=mk('div','cg-b'+(cls?' '+cls:''));w.append(cur);root.append(w);return cur;}
  const host=()=>cur||group();
  const nid=k=>'c-'+(k||'x')+'-'+(uid++);
  function setP(inp){const p=(inp.value-inp.min)/(inp.max-inp.min)*100;inp.style.setProperty('--p',p+'%');}
  function slider(o){
    const s=o.obj,id=nid(o.key),w=mk('label','ctl');w.htmlFor=id;
    const sp=mk('span',null,esc(L(o.label))),out=mk('output'),inp=mk('input');
    Object.assign(inp,{type:'range',id,min:o.min,max:o.max,step:o.step??0.01,value:s[o.key]});
    const show=()=>{out.textContent=o.fmt?o.fmt(+inp.value):(+inp.value).toFixed(0);setP(inp);};
    inp.addEventListener('input',()=>{s[o.key]=+inp.value;show();o.onInput&&o.onInput(+inp.value);});
    w.append(sp,out,inp);host().append(w);show();
    return {el:w,set(v){inp.value=v;show();},sync(){inp.value=s[o.key];show();}};
  }
  function knob(o){
    const s=o.obj,w=mk('div','knob');w.tabIndex=0;w.setAttribute('role','slider');w.setAttribute('aria-label',L(o.label));
    const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','-32 -32 64 64');
    svg.innerHTML=`<circle r="29" fill="#0b0c0a" stroke="#2c3027"/><path class="trk" fill="none" stroke="#2a2e25" stroke-width="4" stroke-linecap="round"/><path class="arc" fill="none" stroke="${o.col||C.lime}" stroke-width="4" stroke-linecap="round"/><circle r="19" fill="url(#kg)" stroke="#000"/><line class="ind" x1="0" y1="-7" x2="0" y2="-17" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`;
    if(!document.getElementById('kgdef')){const d=document.createElementNS(NS,'svg');d.id='kgdef';d.setAttribute('width',0);d.setAttribute('height',0);d.style.position='absolute';d.innerHTML='<defs><radialGradient id="kg" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#4a4f42"/><stop offset="1" stop-color="#16180f"/></radialGradient></defs>';document.body.append(d);}
    const b=mk('b',null,esc(L(o.label))),out=mk('output');w.append(svg,b,out);host().append(w);
    const A0=-135,A1=135,arcP=(a0,a1)=>{const p=a=>[Math.sin(a*Math.PI/180)*25,-Math.cos(a*Math.PI/180)*25];const[x0,y0]=p(a0),[x1,y1]=p(a1);return`M${x0} ${y0}A25 25 0 ${a1-a0>180?1:0} 1 ${x1} ${y1}`;};
    svg.querySelector('.trk').setAttribute('d',arcP(A0,A1));
    const show=()=>{const t=(s[o.key]-o.min)/(o.max-o.min),a=A0+(A1-A0)*clamp(t);
      svg.querySelector('.arc').setAttribute('d',arcP(A0,Math.max(A0+.5,a)));svg.querySelector('.ind').setAttribute('transform',`rotate(${a})`);
      out.textContent=o.fmt?o.fmt(s[o.key]):Math.round(s[o.key]);w.setAttribute('aria-valuenow',s[o.key]);};
    const setV=v=>{if(o.wrap){const r=o.max-o.min;v=((v-o.min)%r+r)%r+o.min;}s[o.key]=clamp(v,o.min,o.max);show();o.onInput&&o.onInput(s[o.key]);};

    w.addEventListener('wheel',e=>{e.preventDefault();setV(s[o.key]-Math.sign(e.deltaY)*(o.max-o.min)/40);},{passive:false});
    w.addEventListener('keydown',e=>{const st=(o.max-o.min)/40;if(e.key==='ArrowUp'||e.key==='ArrowRight'){setV(s[o.key]+st);e.preventDefault();}if(e.key==='ArrowDown'||e.key==='ArrowLeft'){setV(s[o.key]-st);e.preventDefault();}});
    show();return {el:w,sync:show};
  }
  function button(o){const b=mk('button','btn'+(o.cls?' '+o.cls:''),esc(L(o.label)));b.type='button';b.id=nid('b');b.addEventListener('click',()=>o.onClick(b));host().append(b);return b;}
  function hold(o){ // pressed while held: for "pump" style inputs
    const b=mk('button','btn'+(o.cls?' '+o.cls:''),esc(L(o.label)));b.type='button';b.id=nid('h');

  }
  function seg(o){

    const show=()=>bs.forEach(([v,b])=>b.setAttribute('aria-pressed',s[o.key]===v));
    if(o.label){const t=mk('div','cg-t',esc(L(o.label)));t.style.margin='0 0 -4px';host().append(t);}
    host().append(w);show();return {el:w,sync:show};
  }
  function pad(o){ // a drawing field: o.draw(ctx,w,h) paints it, o.on(type,u,v) gets pointer input in 0..1

    const pos=e=>{const r=cv.getBoundingClientRect();return[clamp((e.clientX-r.left)/r.width),clamp((e.clientY-r.top)/r.height)];};
    let down=false;
    cv.addEventListener('pointerdown',e=>{down=true;cv.setPointerCapture(e.pointerId);o.on&&o.on('down',...pos(e));});
    cv.addEventListener('pointermove',e=>{o.on&&o.on(down?'drag':'move',...pos(e));});
    cv.addEventListener('pointerup',e=>{down=false;o.on&&o.on('up',...pos(e));});
    cv.addEventListener('pointerleave',()=>{o.on&&o.on('leave',0,0);});
    const api={el:cv,draw(){if(!W||cv.width<2)fit();if(W)o.draw(ctx,W,H);}};

  function note(t,cls){const p=mk('p','note'+(cls?' '+cls:''),esc(L(t)));host().append(p);return p;}
  return {begin,group,slider,knob,button,hold,toggle,seg,pad,readouts,note,mk};
})();

/* ================= People on the plaza: what the two Orbbec depth cameras would report =================
   person: {id, x (m along the façade), z (m from the glass), vx, speed (m/s, smoothed), still (s without moving),
            wave (s left of waving), jump (s left of a jump), jy (m off the ground), kid, auto, you}
   CROWD.act is the plaza's total movement, smoothed: ~0 empty, ~1 one person walking, 3+ a lively crowd. */
const CROWD={people:[],act:0,energy:0,maxAuto:2,mouse:true,sel:null,_spawn:1.2,_id:1};
const PX0=-1.3,PX1=F.W+1.3,PZ1=6;

function crowdAdd(o={}){const p=newPerson(o);CROWD.people.push(p);return p;}
function crowdRemove(p){CROWD.people=CROWD.people.filter(q=>q!==p);if(CROWD.sel===p)CROWD.sel=null;}
function spawnWalker(){
  const fromL=Math.random()<.5,z=1.4+Math.random()*3.6;
  const p=crowdAdd({auto:true,mode:'walk',x:fromL?PX0:PX1,z,sp:.9+Math.random()*.6});
  if(Math.random()<.6){const pane=F.panes[Math.floor(Math.random()*6)];p.plan=[{x:pane.cx+(Math.random()-.5)*.3,z:.9+Math.random()*1.6,stop:3+Math.random()*6},{x:fromL?PX1:PX0,z:1.4+Math.random()*3.6}];}
  else p.plan=[{x:fromL?PX1:PX0,z:z+(Math.random()-.5)}];
  p.tgt=p.plan.shift();
}
function crowdUpdate(dt){
  CROWD._spawn-=dt;
  const autos=CROWD.people.filter(p=>p.auto).length;
  if(CROWD._spawn<=0){CROWD._spawn=3+Math.random()*6;if(autos<CROWD.maxAuto)spawnWalker();}
  if(autos>CROWD.maxAuto){const p=CROWD.people.find(q=>q.auto&&q.mode!=='leave');if(p){p.plan=[];p.tgt={x:p.x<F.W/2?PX0:PX1,z:p.z};p.mode='walk';p.pause=0;}}
  let act=0;
  for(const p of [...CROWD.people]){
    p.t+=dt;
    if(p.auto){
      if(p.pause>0){p.pause-=dt;if(Math.random()<dt*.25)p.wave=1.6;if(Math.random()<dt*.12)p.jump=.6;if(p.pause<=0){p.tgt=p.plan.shift();p.mode='walk';}}
      else if(p.tgt){const dx=p.tgt.x-p.x,dz=p.tgt.z-p.z,d=Math.hypot(dx,dz),st=Math.min(d,p.sp*dt);
        if(d>.02){p.x+=dx/d*st;p.z+=dz/d*st;}
        if(d<.05){if(p.tgt.stop){p.pause=p.tgt.stop;p.mode='stand';p.tgt.stop=0;}else if(p.plan.length)p.tgt=p.plan.shift();else{crowdRemove(p);continue;}}}
    }
    if(p.px==null){p.px=p.x;p.pz=p.z;}
    const vx=(p.x-p.px)/Math.max(dt,1e-3),vz=(p.z-p.pz)/Math.max(dt,1e-3);p.px=p.x;p.pz=p.z;
    p.vx=approach(p.vx,vx,8,dt);p.vz=approach(p.vz,vz,8,dt);
    p.speed=approach(p.speed,Math.hypot(vx,vz),5,dt);
    p.still=p.speed<.15?p.still+dt:0;
    p.wave=Math.max(0,p.wave-dt);
    if(p.jump>0){p.jump=Math.max(0,p.jump-dt);const k=1-p.jump/.6;p.jy=Math.sin(Math.PI*clamp(k))*.45;}else p.jy=0;

/* nearest person in front of column c (within maxZ metres), or null */
function personAtCol(c,maxZ=6){let b=null,d=1e9;for(const p of CROWD.people){if(p.z>maxZ)continue;if(F.colAt(p.x)!==c||Math.abs(p.x-F.cols[c].cx)>.55)continue;if(p.z<d){d=p.z;b=p;}}return b;}

/* ---------- the plaza widget in the panel ---------- */
const Plaza=(()=>{
  const cv=document.getElementById('plaza'),ctx=cv.getContext('2d');let W=0,H=0,drag=null,lastTap=0;
  const fit=()=>{const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);W=r.width;H=Math.round(W*.52);cv.style.height=H+'px';cv.width=Math.round(W*d);cv.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);};
  const TOP=26;
  const sx=x=>(x-PX0)/(PX1-PX0)*W,sz=z=>TOP+z/PZ1*(H-TOP-6);
  const ix=px=>PX0+px/W*(PX1-PX0),iz=py=>clamp((py-TOP)/(H-TOP-6)*PZ1,.3,PZ1);
  const hit=(px,py)=>{let b=null,d=18;for(const p of CROWD.people){const e=Math.hypot(sx(p.x)-px,sz(p.z)-py);if(e<d){d=e;b=p;}}return b;};
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{const[px,py]=pos(e);if(py<TOP-4)return;let p=hit(px,py);const now=performance.now();
    if(p&&now-lastTap<320&&CROWD.sel===p){crowdRemove(p);lastTap=0;return;}lastTap=now;
    if(!p)p=crowdAdd({x:ix(px),z:iz(py)});
    if(p.auto){p.auto=false;p.plan=[];p.tgt=null;p.pause=0;}
    p.mode='drag';CROWD.sel=p;drag=p;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
  cv.addEventListener('pointermove',e=>{if(!drag)return;const[px,py]=pos(e);drag.x=clamp(ix(px),PX0,PX1);drag.z=iz(py);});
  const up=()=>{if(drag)drag.mode='stand';drag=null;cv.style.cursor='grab';};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  new ResizeObserver(fit).observe(cv);
  function draw(T){
    if(!W)fit();if(!W)return;
    ctx.clearRect(0,0,W,H);
    // paving grid
    ctx.strokeStyle='#14170f';ctx.lineWidth=1;
    for(let x=Math.ceil(PX0);x<=PX1;x++){ctx.beginPath();ctx.moveTo(sx(x),TOP);ctx.lineTo(sx(x),H);ctx.stroke();}
    for(let z=1;z<=PZ1;z++){ctx.beginPath();ctx.moveTo(0,sz(z));ctx.lineTo(W,sz(z));ctx.stroke();}
    ctx.fillStyle='#3d4236';ctx.font="10px 'IBM Plex Mono',monospace";ctx.textAlign='left';
    for(let z=2;z<=PZ1;z+=2)ctx.fillText(z+' m',4,sz(z)-3);
    // camera cones
    for(const u of F.units){const cx=sx(u.cx);const gr=ctx.createRadialGradient(cx,TOP,0,cx,TOP,H);gr.addColorStop(0,'rgba(202,254,3,.10)');gr.addColorStop(1,'rgba(202,254,3,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.moveTo(cx,TOP);ctx.lineTo(cx-H*1.05,H);ctx.lineTo(cx+H*1.05,H);ctx.closePath();ctx.fill();
      ctx.fillStyle='#CAFE03';ctx.fillRect(cx-6,TOP-6,12,5);}
    // façade strip
    ctx.fillStyle='#262a21';ctx.fillRect(0,0,W,TOP-6);
    for(const p of F.panes)if(p.r===0){ctx.fillStyle='#0e100c';ctx.fillRect(sx(p.x),4,sx(p.x+p.w)-sx(p.x),TOP-14);}
    ctx.fillStyle='#8a907e';ctx.textAlign='center';ctx.font="600 9px 'IBM Plex Mono',monospace";
    for(const c of F.cols)ctx.fillText(c.c+1,sx(c.cx),TOP-11);
    // people
    for(const p of CROWD.people){
      const x=sx(p.x),y=sz(p.z),r=(p.kid?6:8)*(1+p.jy*.8);
      if(p.speed>.2){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-p.vx*9,y-p.vz*9);ctx.stroke();}
      if(p.wave>0){ctx.strokeStyle='#ffb21e';ctx.lineWidth=2;for(let k=1;k<3;k++){ctx.beginPath();ctx.arc(x,y,r+4*k+Math.sin(T*12)*1.5,-2.4,-.7);ctx.stroke();}}
      if(p.jump>0){ctx.strokeStyle='#2fd6e0';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+10*(1-p.jump/.6),0,TAU);ctx.stroke();}
      ctx.fillStyle=p.you?'#CAFE03':p.auto?'#8f9682':'#eef1e4';ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
      if(CROWD.sel===p){ctx.strokeStyle='#CAFE03';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+3,0,TAU);ctx.stroke();}
      if(p.you){ctx.fillStyle='#000';ctx.font="700 8px 'IBM Plex Mono',monospace";ctx.fillText(LANG==='sv'?'du':'you',x,y+3);}

    if(!CROWD.people.length){ctx.fillStyle='#5d6356';ctx.font="12px 'IBM Plex Mono',monospace";ctx.textAlign='center';ctx.fillText(L({sv:'Klicka för att ställa ut en person',en:'Click to place a person'}),W/2,H/2+10);}

/* ================= Snow crystals: Reiter's hexagonal cellular automaton (2005) =================
   Each cell holds water mass s. Frozen when s >= 1. Cells next to ice are "receptive": they keep their water and get +gamma.
   The rest diffuse with their neighbours. Low background vapour (beta) gives branching dendrites, high gives plates.
   Temperature and humidity pick beta/gamma the way the Nakaya diagram says real crystals grow:
   about -2 °C plates, -5 °C needles and columns, -15 °C stars (dendrites) when it is humid, -25 °C plates and columns again. */
function nakaya(temp,hum){ // temp in °C (below 0), hum 0..1 (supersaturation). Returns growth habit and CA params.
  const t=-temp;
  let habit,beta,gamma;
  if(t<3.5){habit='plate';beta=lerp(.92,.62,hum);gamma=lerp(.0012,.0035,hum);}
  else if(t<9){habit='needle';beta=.8;gamma=.002;}
  else if(t<12.5){habit='sector';beta=lerp(.82,.5,hum);gamma=lerp(.0012,.003,hum);}
  else if(t<18){habit=hum>.45?'star':'sector';beta=lerp(.7,.35,hum);gamma=lerp(.001,.0028,hum);}
  else if(t<23){habit='plate';beta=lerp(.86,.58,hum);gamma=lerp(.001,.0025,hum);}
  else{habit='column';beta=.85;gamma=.0015;}
  return {habit,beta,gamma};
}

    if(p.k==='snow'||p.k==='dust'){p.x+=Math.sin(p.ph)*.06*dt;}
    if(p.y>gy){if(p.k==='hail'&&!p.b){p.b=1;p.vy=-p.vy*.35;p.y=gy;}else p.dead=1;
      if(p.k==='snow'||p.k==='sleet')snowDepth=Math.min(.09,snowDepth+.00012);if(p.k==='rain'||p.k==='hail')puddle=Math.min(1,puddle+.0015);}
    if(p.k==='hail'&&p.b)p.vy+=dt*6;
    if(p.k==='rain'){g.strokeStyle='rgba(190,220,255,.6)';g.lineWidth=.006;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-.01,p.y-.07);g.stroke();}
    else if(p.k==='hail'){g.fillStyle='#eef6ff';g.beginPath();g.arc(p.x,p.y,.016,0,TAU);g.fill();}
    else if(p.k==='sleet'){g.fillStyle='rgba(220,235,255,.75)';g.beginPath();g.arc(p.x,p.y,.012,0,TAU);g.fill();}
    else if(p.k==='dust'){g.fillStyle=rgba('#ffffff',.5+.5*Math.sin(p.ph*3));g.fillRect(p.x,p.y,.006,.006);}
    else{g.strokeStyle='#f4fbff';g.lineWidth=.005;g.beginPath();for(let a=0;a<3;a++){const ang=a*Math.PI/3+p.ph*.3;g.moveTo(p.x-Math.cos(ang)*p.r,p.y-Math.sin(ang)*p.r);g.lineTo(p.x+Math.cos(ang)*p.r,p.y+Math.sin(ang)*p.r);}g.stroke();}}
  precip=precip.filter(p=>!p.dead&&p.y>z.y-.1);if(precip.length>700)precip.splice(0,precip.length-700);
  if(T>1)snowDepth=Math.max(0,snowDepth-dt*.004*(T/5));if(T<0)puddle=Math.max(0,puddle-dt*.05);else puddle=Math.max(0,puddle-dt*.01*(T>25?3:1));
  // heat shimmer and boiling-hot ground
  // skyline and ground
  g.drawImage(sky,z.x,gy-.42,z.w,.44);
  g.fillStyle=T<0&&snowDepth>.005?'#dfe9f2':'#0b0d10';g.fillRect(z.x,gy,z.w,z.h);
  if(snowDepth>.003){g.fillStyle='#eef5fb';g.beginPath();g.moveTo(z.x,gy+.02);for(let x=0;x<=z.w;x+=.05)g.lineTo(z.x+x,gy-snowDepth*(.8+.4*noise2(x*4,1)));g.lineTo(z.x+z.w,gy+.05);g.fill();}
  if(puddle>.05){g.fillStyle=rgba('#7fa8c8',puddle*.5);for(let i=0;i<4;i++){g.beginPath();g.ellipse(z.x+.25+i*.52,gy+.07,.18*puddle+.05,.02,0,0,TAU);g.fill();}
    if(kind==='rain'){g.strokeStyle='rgba(220,240,255,.6)';g.lineWidth=.004;for(let i=0;i<4;i++){const ph=(t*1.5+i*.37)%1;g.beginPath();g.ellipse(z.x+.25+i*.52+(hash(i+Math.floor(t*1.5))-.5)*.2,gy+.07,ph*.06,ph*.012,0,0,TAU);g.globalAlpha=1-ph;g.stroke();g.globalAlpha=1;}}}
  if(boil>0){for(let i=0;i<8;i++){const ph=(t*.25+i*.13)%1;g.fillStyle=rgba('#ffffff',(1-ph)*.35*boil);g.beginPath();g.arc(z.x+hash(i)*z.w,gy-ph*z.h,.12+ph*.3,0,TAU);g.fill();}}
  g.restore();
  txt(g,'SKELLEFTEÅ',z.x+.06,z.y+.1,.05,{align:'left',mono:true,w:600,col:'#fff',ls:.12,alpha:.85});
  const kl={dust:{sv:'Isnålar i luften',en:'Diamond dust'},snow:{sv:'Snö',en:'Snow'},sleet:{sv:'Blötsnö',en:'Sleet'},rain:{sv:'Regn',en:'Rain'},hail:{sv:'Åska och hagel',en:'Thunder and hail'}};
  const label=kind?L(kl[kind]):T>=100?L({sv:'Kokhett',en:'Boiling hot'}):T>32?L({sv:'Värmebölja',en:'Heatwave'}):'';
  if(label)txt(g,label,z.x+z.w-.06,z.y+.11,.085,{align:'right',w:800,col:'#fff',stroke:.012,strokeCol:'rgba(0,0,0,.6)'});
}

/* ---------- the glass, the number, the scale ---------- */
let gbub=[],level=1,steam=[];
function drawGlass(T,t,dt){
  const p=F.pane(4,1),cx=p.cx,base=p.y+p.h-.16,gw=.4,gh=.72,top=base-gh;
  const bg=g.createLinearGradient(0,p.y,0,p.y+p.h);bg.addColorStop(0,'#0c0f14');bg.addColorStop(1,'#1a1e24');g.fillStyle=bg;g.fillRect(p.x,p.y,p.w,p.h);
  g.fillStyle='#2a2f36';g.fillRect(p.x,base,p.w,p.h);g.fillStyle='#3a414a';g.fillRect(p.x,base,p.w,.012);
  if(T>=100)level=Math.max(.25,level-dt*.01);else level=Math.min(1,level+dt*.05);
  const wl=top+gh*(1-.82*level),solid=T<0;
  g.save();g.beginPath();g.moveTo(cx-gw/2,top);g.lineTo(cx-gw/2*.86,base);g.lineTo(cx+gw/2*.86,base);g.lineTo(cx+gw/2,top);g.closePath();g.clip();
  const wcol=solid?['#d9f2ff','#8fc8e6']:[mix('#3bb7ff','#ff7a5a',smooth(40,100,T)),mix('#0b5a9a','#7a1f2a',smooth(40,100,T))];
  const wg=g.createLinearGradient(0,wl,0,base);wg.addColorStop(0,wcol[0]);wg.addColorStop(1,wcol[1]);g.fillStyle=wg;g.globalAlpha=solid?.95:.75;
  g.beginPath();g.moveTo(cx-gw,wl);for(let x=-gw;x<=gw;x+=.02)g.lineTo(cx+x,wl+(solid?0:Math.sin(x*30+t*(T>=99?12:3))*(T>=99?.012:.003)));g.lineTo(cx+gw,base);g.lineTo(cx-gw,base);g.fill();g.globalAlpha=1;
  if(solid){g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=.005;for(let i=0;i<6;i++){g.beginPath();g.moveTo(cx+(hash(i)-.5)*gw,wl+hash(i+1)*(base-wl));g.lineTo(cx+(hash(i+2)-.5)*gw,wl+hash(i+3)*(base-wl));g.stroke();}
    for(let i=0;i<10;i++){g.fillStyle='rgba(255,255,255,.8)';g.beginPath();g.arc(cx+(hash(i+7)-.5)*gw*.8,wl+.04+hash(i+8)*(base-wl-.08),.006+hash(i)*.008,0,TAU);g.fill();}}
  else if(T<4){const k=1-smooth(0,4,T);for(let i=0;i<3;i++){const ix=cx+(i-1)*.1+Math.sin(t+i)*.01,iy=wl-.02+Math.sin(t*1.3+i)*.006,sz=.09*k+.02;
      g.fillStyle='rgba(235,250,255,.85)';rrect(g,ix-sz/2,iy-sz*.25,sz,sz,.015);g.fill();g.strokeStyle='#fff';g.lineWidth=.004;g.stroke();}}
  if(T>65&&!solid&&Math.random()<dt*smooth(65,100,T)*25)gbub.push({x:cx+(Math.random()-.5)*gw*.75,y:base-.01,r:.004+Math.random()*.01*(T>=99?3:1)});
  for(const b of gbub){b.y-=dt*(.15+b.r*8);b.r+=dt*.004;g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=.004;g.beginPath();g.arc(b.x,b.y,b.r,0,TAU);g.stroke();}
  gbub=gbub.filter(b=>b.y>wl);
  g.restore();
  // the glass itself
  g.strokeStyle='rgba(230,245,255,.8)';g.lineWidth=.01;g.beginPath();g.moveTo(cx-gw/2,top);g.lineTo(cx-gw/2*.86,base);g.lineTo(cx+gw/2*.86,base);g.lineTo(cx+gw/2,top);g.stroke();
  g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.moveTo(cx-gw/2+.03,top+.03);g.lineTo(cx-gw/2*.86+.03,base-.03);g.lineTo(cx-gw/2*.86+.06,base-.03);g.lineTo(cx-gw/2+.06,top+.03);g.fill();
  // condensation when the glass is colder than the dew point of the room
  if(T<12){const k=smooth(12,2,T);for(let i=0;i<26;i++){const yy=top+.05+hash(i+3)*(gh-.08),side=hash(i)<.5?-1:1,xx=cx+side*(gw/2-.01-(yy-top)/gh*gw*.07);g.fillStyle=rgba(T<0?'#ffffff':'#cfefff',k*.9);g.beginPath();g.arc(xx,yy,.006+hash(i+5)*.006,0,TAU);g.fill();}}
  // steam
  if(T>45){if(Math.random()<dt*smooth(45,100,T)*14)steam.push({x:cx+(Math.random()-.5)*gw*.6,y:wl,a:1,r:.03});}
  for(const v of steam){v.y-=dt*.25;v.x+=Math.sin(v.y*12+t)*dt*.05;v.r+=dt*.05;v.a-=dt*.4;g.fillStyle=rgba('#ffffff',Math.max(0,v.a)*.35);g.beginPath();g.arc(v.x,v.y,v.r,0,TAU);g.fill();}
  steam=steam.filter(v=>v.a>0);
  // thermometer in the glass
  const tx=cx+.11,t0=top-.2,t1=base-.08,frac=clamp((T-TMIN)/(TMAX-TMIN));
  g.fillStyle='rgba(255,255,255,.9)';rrect(g,tx-.018,t0,.036,t1-t0,.018);g.fill();
  g.fillStyle=tcol(T);g.beginPath();g.arc(tx,t1,.03,0,TAU);g.fill();g.fillRect(tx-.009,lerp(t1,t0+.03,frac),.018,t1-lerp(t1,t0+.03,frac));
  g.fillStyle='#333';for(let k=0;k<=7;k++){g.fillRect(tx-.018,lerp(t1,t0+.03,k/7),.012,.003);}
}
function drawNumber(T,t){
  const p=F.pane(3,1);const bg=g.createLinearGradient(0,p.y,0,p.y+p.h);bg.addColorStop(0,'#080a0c');bg.addColorStop(1,mix('#080a0c',tcol(T),.18));g.fillStyle=bg;g.fillRect(p.x,p.y,p.w,p.h);
  const who=s.heat>3?{sv:'NI VÄRMER',en:'YOU ARE HEATING'}:s.chill>3?{sv:'NI KYLER',en:'YOU ARE COOLING'}:s.live?{sv:'SKELLEFTEÅ NU',en:'SKELLEFTEÅ NOW'}:{sv:'LABBET',en:'THE LAB'};
  txt(g,L(who),p.cx,p.y+.14,.04,{mono:true,w:600,col:C.lime,ls:.1});
  const n=Math.round(T),str=(n<0?'−':'')+Math.abs(n);txt(g,str,p.cx,p.cy-.06,str.length>3?.21:str.length>2?.26:.32,{w:900,col:tcol(T),glow:tcol(T),blur:24});
  txt(g,'°C',p.cx,p.cy+.17,.11,{w:800,col:'#fff'});
  const diff=s.target-T;if(Math.abs(diff)>.6){const up=diff>0,y=p.cy+.36+Math.sin(t*6)*.01;g.fillStyle=up?'#ff6a3d':'#7fd8ff';g.beginPath();g.moveTo(p.cx,y+(up?-.05:.05));g.lineTo(p.cx-.05,y+(up?.03:-.03));g.lineTo(p.cx+.05,y+(up?.03:-.03));g.fill();}
}
function drawScale(T){
  const p=F.pane(5,1),x0=p.x+.16,x1=p.x+p.w-.1,y0=p.y+.1,y1=p.y+p.h-.1,yy=v=>lerp(y1,y0,(v-TMIN)/(TMAX-TMIN));
  g.fillStyle='#07090b';g.fillRect(p.x,p.y,p.w,p.h);
  const bands=[[TMIN,0,'#7fd8ff','ice'],[0,100,'#1c8fe0','water'],[100,TMAX,'#f3f3f3','steam']];
  for(const[a,b,c,k]of bands){g.fillStyle=rgba(c,phase(T)===k?.95:.28);g.fillRect(x0,yy(b),x1-x0,yy(a)-yy(b));
    const h=yy(a)-yy(b);if(h>.12){g.save();g.translate((x0+x1)/2,(yy(a)+yy(b))/2);g.rotate(-Math.PI/2);txt(g,L(PH[k]),0,0,Math.min(.11,h*.5),{w:900,col:phase(T)===k?'#000':'#fff',alpha:phase(T)===k?.9:.6});g.restore();}}
  for(const v of [-20,0,4,37,100]){const y=yy(v);g.fillStyle='#fff';g.fillRect(x0-.05,y-.002,.04,.004);txt(g,(v<0?'−':'')+Math.abs(v)+'°',x0-.07,y,.034,{align:'right',mono:true,col:'#cfd3c4'});}
  const y=yy(clamp(T,TMIN,TMAX));g.fillStyle=C.lime;g.beginPath();g.moveTo(x0-.005,y);g.lineTo(x0-.05,y-.03);g.lineTo(x0-.05,y+.03);g.fill();g.fillRect(x0,y-.005,x1-x0,.01);
}

/* frost grows in from the frames when it is below zero; steam fogs the glass when it is hot */
const frost=(()=>{const c=document.createElement('canvas'),W=200,H=480;c.width=W;c.height=H;const x=c.getContext('2d');x.lineCap='round';
  const branch=(px,py,a,len,w,d)=>{if(d>4||len<2)return;const ex=px+Math.cos(a)*len,ey=py+Math.sin(a)*len;x.lineWidth=w;x.beginPath();x.moveTo(px,py);x.lineTo(ex,ey);x.stroke();
    const n=4;for(let i=1;i<n;i++){const f=i/n,bx=px+(ex-px)*f,by=py+(ey-py)*f;branch(bx,by,a+(i%2?1:-1)*(1.05+Math.random()*.2),len*.38*(1-f*.5),w*.6,d+1);}
    branch(ex,ey,a+(Math.random()-.5)*.5,len*.62,w*.75,d+1);};
  x.strokeStyle='rgba(225,245,255,.55)';
  for(let i=0;i<70;i++){const side=i%4,t=Math.random(),corner=Math.random()<.5;const[px,py,a]=side===0?[t*W,0,Math.PI/2]:side===1?[t*W,H,-Math.PI/2]:side===2?[0,t*H,0]:[W,t*H,Math.PI];
    branch(px,py,a+(Math.random()-.5)*1.1,(corner?10:6)+Math.random()*16,1.3,0);}
  // feathery haze along the edges
  const edge=(x0,y0,x1,y1)=>{const gr=x.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,'rgba(230,248,255,.35)');gr.addColorStop(1,'rgba(230,248,255,0)');x.fillStyle=gr;x.fillRect(0,0,W,H);};
  edge(0,0,0,40);edge(0,H,0,H-40);edge(0,0,30,0);edge(W,0,W-30,0);
  return c;})();
function drawPaneFx(T){
  const fr=smooth(-1,-22,T),fog=smooth(75,100,T);
  if(fr<=0&&fog<=0)return;
  for(const p of F.panes){
    if(fr>0){g.globalAlpha=.25+fr*.75;g.drawImage(frost,p.x,p.y,p.w,p.h);g.globalAlpha=1;}
    if(fog>0){const gr=g.createLinearGradient(0,p.y+p.h,0,p.y);gr.addColorStop(0,rgba('#ffffff',.55*fog));gr.addColorStop(.6,rgba('#ffffff',.18*fog));gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(p.x,p.y,p.w,p.h);}
  }
}

const idea={
  id:'temperatur',n:1,post:'riso',steam:'S',col:C.cyan,
  name:{sv:'Temperatur',en:'Temperature'},sub:{sv:'Vatten i fyra skalor',en:'Water at four scales'},
  q:{sv:'Vad händer med vattnet när det blir kallare eller varmare?',en:'What happens to water when it gets colder or warmer?'},
  pitch:{tagline:{sv:'Samma vatten på fyra skalor samtidigt: molekyler, mikroskop, ett glas och vädret över Skellefteå. Står ingen framför fönstren är det en termometer för dagens väder. Rör ni er blir det varmare, står ni stilla blir det kallare, precis som molekylerna.',en:'The same water at four scales at once: molecules, microscope, a glass and the weather over Skellefteå. With nobody there it is a thermometer for today. Move and it warms up, stand still and it cools down, just like the molecules.'},
    how:[{sv:'Idle: visar dagens temperatur i Skellefteå på alla fyra nivåer.',en:'Idle: shows today\'s Skellefteå temperature at all four levels.'},

      {sv:'Stå alldeles stilla: det kyls ner, snöflingor växer och frosten kryper in från ramarna.',en:'Stand very still: it cools, snow crystals grow and frost creeps in from the frames.'}],
    trick:{sv:'Vänster enhet är det osynliga (molekyler, mikroskop), höger det synliga (väder, glas). Frost växer in från spröjsen och kokångan immar fönstren.',en:'The left unit is the invisible (molecules, microscope), the right the visible (weather, glass). Frost grows in from the mullions and boiling steam fogs the panes.'},
    chips:[['cam',{sv:'Djupkamera: rörelse = värme',en:'Depth cam: motion = heat'}],['web',{sv:'Webb: reglage',en:'Web: slider'}],['crowd',{sv:'Hela torget samarbetar',en:'The whole plaza works together'}]],
    fake:{sv:'Dagens temperatur är simulerad (SMHI senare)',en:'Today\'s temperature is simulated (SMHI later)'}},
  init(){s.base=FAKE.tempAt();s.T=s.target=s.manual=Math.round(s.base);s.heat=0;s.chill=0;s.live=true;s.auto=false;buildLattice();flake.reset(.6,.002);flakeHab='';precip=[];snowDepth=s.T<0?.04:0;level=1;},
  update(dt,t){
    s.base=s.live?FAKE.tempAt():s.manual;
    if(s.auto){s.autoT+=dt;s.base=lerp(-26,106,(1-Math.cos(s.autoT/44*TAU))/2);}
    // only people close to the glass count (within 2.6 m), so passers-by far out leave the thermometer alone
    let act=0,still=0;for(const p of CROWD.people){if(p.z>2.6)continue;act+=Math.min(p.speed/1.3,1.8)+(p.wave>0?.8:0)+(p.jump>0?1.6:0);if(p.still>2&&p.wave<=0)still++;}
    if(s.crowd){s.heat+=(act*1.7-s.heat*.12)*dt;s.chill=approach(s.chill,Math.min(30,still*9),.25,dt);}else{s.heat=approach(s.heat,0,.5,dt);s.chill=approach(s.chill,0,.5,dt);}
    if(s.hot)s.heat+=40*dt;if(s.cold)s.chill=Math.min(40,s.chill+20*dt);
    s.heat=clamp(s.heat,0,140);
    s.target=clamp(s.base+s.heat-s.chill,TMIN,TMAX);
    s.T=approach(s.T,s.target,1.2,dt);
    const ph=phase(s.T);if(s.lastPhase&&ph!==s.lastPhase){if(ph==='steam')s.boilFx=2.5;if(ph==='ice'&&s.lastPhase==='water')s.freezeFx=2.5;}s.lastPhase=ph;
    s.boilFx=Math.max(0,s.boilFx-dt);s.freezeFx=Math.max(0,s.freezeFx-dt);
    stepMolecules(dt,s.T);
    if(s.T<0){const nk=nakaya(Math.max(-28,s.T),s.hum);
      if(nk.habit!==flakeHab&&(flake.size>.95||flakeHab===''||flakeT>8)){flake.reset(nk.beta,nk.gamma);flakeHab=nk.habit;flakeT=0;}
      flake.set(nk.beta,nk.gamma);flakeT+=dt;
      if(nk.habit==='needle'||nk.habit==='column')flake.grow(dt*.08);else flake.step(18);
      if(flake.full&&flakeT>14){flake.reset(nk.beta,nk.gamma);flakeT=0;}}
    else{flakeHab='';}
  },
  draw(t){

    drawMolecules(T);drawLenses(T,t,dt);drawWeather(T,t,dt);drawNumber(T,t);drawGlass(T,t,dt);drawScale(T);drawPaneFx(T);
    if(s.boilFx>0){const k=s.boilFx/2.5,p=F.pane(4,0);smiley(g,p.cx,p.cy,.22*(1+(1-k)*.3),true,C.lime);txt(g,L({sv:'KOKAR!',en:'BOILING!'}),p.cx,p.cy+.4,.11,{w:900,col:C.lime,alpha:k});}
    if(s.freezeFx>0){const k=s.freezeFx/2.5,p=F.pane(1,0);g.globalAlpha=k;g.fillStyle='rgba(0,0,0,.5)';g.fillRect(p.x,p.y+p.h*.3,p.w,p.h*.4);g.globalAlpha=1;txt(g,L({sv:'FRYSER!',en:'FREEZING!'}),p.cx,p.cy,.12,{w:900,col:'#bfefff',alpha:k});}
  },
  hud(){const p=L(PH[phase(s.T)]).toLowerCase();return `${fmtT(s.T)} °C · ${p}`+(s.heat>3?` · ${L({sv:'publiken värmer',en:'the crowd heats'})} +${Math.round(s.heat)}°`:'')+(s.chill>3?` · ${L({sv:'stillhet kyler',en:'stillness cools'})} −${Math.round(s.chill)}°`:'');},
  controls(){

    UI.slider({obj:s,key:'hum',label:{sv:'Luftfuktighet (för snökristallen)',en:'Humidity (for the snow crystal)'},min:0,max:1,step:.01,fmt:v=>Math.round(v*100)+' %',onInput:()=>{flakeHab='x';}});
    this.ro=UI.readouts([[{sv:'Ute nu',en:'Outside now'}],[{sv:'Visar',en:'Showing'}],[{sv:'Publikens värme',en:'Crowd heat'}],[{sv:'Stillhet',en:'Stillness'}]]);
    UI.note({sv:'Simulerad data: dagens temperatur räknas fram ur normalvärden för Skellefteå. På riktigt kopplas den till SMHI.',en:'Simulated data: today\'s temperature is derived from Skellefteå normals. In the real build it comes from SMHI.'},'fake');

   Right unit bottom: the ground cut open along the scan line, with the soil layers and a drill where you stand.

   The terrain is a simplified model of the Skellefteå area (32 × 32 km), not survey data. */

  {name:{sv:'Skellefteälven',en:'Skellefte River'},pts:[[-16.5,2.2],[-12,3.4],[-8,2.4],[-5,3],[-2.5,1],[0,0],[2.5,-.6],[4.5,-1.8],[7,-2.3],[9.5,-3.4],[11.6,-3.6]],w:.45,d:26},

/* ================= 5 · JUL: Snöflingefabriken (the snowflake factory), in backlit cut paper =================
   The game: a snowflake falls down the left unit above you, and you steer it with your body.
   The three columns are three temperatures (−2°, −5°, −15°), and each grows a different crystal: plates, needles, stars.
   Your path between the columns makes your flake one of a kind. When it lands it flies behind the pier
   and is hung on the tree in the right unit. Twelve flakes and the star lights up. Growth: Reiter's model (45-snow.js). */
(()=>{

const LX0=U0.ix0+.13,LX1=U0.ix1-.13;
const habitName=k=>L(HABIT[k]||{});

function spawn(o){if(flakes.filter(f=>f.st==='fall').length>=3)return null;const f=Object.assign({fl:new Flake(81,160),x:o.x??F.cols[1].cx,y:TOPY,st:'fall',t:0,trail:[],lanes:new Set(),owner:null,path:null,wob:Math.random()*TAU},o);
  const ln=LANES[laneOf(f.x)],nk=nakaya(ln.t,.8);f.fl.reset(nk.beta,nk.gamma);flakes.push(f);return f;}

let cur=null,view='bild',T0=performance.now(),last=T0,frameNo=0;
const VIEWS=[['bild',{sv:'Bild',en:'Image'}],['ramar',{sv:'Bild + ramar',en:'Image + frames'}],['3d',{sv:'Fönster 3D',en:'Window 3D'}]];

function fitOut(){const r=stage.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);out.width=Math.max(2,Math.round(r.width*d));out.height=Math.max(2,Math.round(r.height*d));}
new ResizeObserver(fitOut).observe(stage);

/* where the screen canvas sits inside the output canvas */
function placement(){
  const W=out.width,H=out.height;
  const k=view==='ramar'?.8:1,s=Math.min(W/F.W,H/F.H)*k;
  return {s,ox:(W-F.W*s)/2,oy:view==='ramar'?(H-F.H*s)*.36:(H-F.H*s)/2};
}
function drawFrames(c,{s,ox,oy}){
  c.save();c.translate(ox,oy);c.scale(s,s);
  const W=out.width/s,H=out.height/s,X0=-ox/s,Y0=-oy/s;
  const wall=c.createLinearGradient(0,Y0,0,Y0+H);wall.addColorStop(0,'#2a2925');wall.addColorStop(1,'#1d1c19');
  c.fillStyle=wall;c.beginPath();c.rect(X0,Y0,W,H);
  for(const u of F.units)c.rect(u.x1,0,u.x0-u.x1,F.H);   // reversed rects cut the holes
  c.fill('evenodd');
  c.fillStyle='#121210';c.fillRect(X0,F.H+F.SILL,W,H);
  c.fillStyle='#3a3b3c';c.fillRect(-.06,F.H,F.W+.12,.05);
  c.fillStyle='#16181b';
  for(const u of F.units){
    c.fillRect(u.x0,0,u.x1-u.x0,F.K);c.fillRect(u.x0,F.bot,u.x1-u.x0,F.K);c.fillRect(u.x0,0,F.K,F.H);c.fillRect(u.ix1,0,F.K,F.H);
    c.fillRect(u.ix0,F.trY0,u.ix1-u.ix0,F.TR);
    for(let k=1;k<3;k++)c.fillRect(u.ix0+k*F.PW+(k-1)*F.MU,0,F.MU,F.H);
  }
  c.fillStyle='rgba(255,255,255,.05)';for(const p of F.panes)c.fillRect(p.x,p.y,p.w,.012);
  c.restore();
}
let styleOn=true;
function present(){
  const T=(performance.now()-T0)/1000,src=styleOn?POST.run(cur.post,T):scr;
  if(view==='3d'){View3D.render(T,src);return;}
  const P=placement();
  octx.setTransform(1,0,0,1,0,0);octx.fillStyle='#000';octx.fillRect(0,0,out.width,out.height);
  octx.imageSmoothingQuality='high';
  octx.drawImage(src,P.ox,P.oy,F.W*P.s,F.H*P.s);
  if(view==='ramar')drawFrames(octx,P);
}
function setView(v){
  view=v;v3.hidden=v!=='3d';out.hidden=v==='3d';
  document.querySelectorAll('#viewseg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
  setTip();
}
function setTip(){
  document.getElementById('tip').textContent=view==='3d'?L({sv:'Dra för att snurra · scrolla för att zooma',en:'Drag to orbit · scroll to zoom'}):
    cur&&cur.pointer?L(cur.pointerTip||{sv:'Klicka och dra i bilden',en:'Click and drag on the image'}):
    CROWD.mouse?L({sv:'Musen är en besökare: rör den för att gå, håll nere för att vinka',en:'Your mouse is a visitor: move to walk, hold to wave'}):'';
}

/* the mouse over the image: a visitor, or a pointer for ideas that take drawing */
function toFacade(e){const r=out.getBoundingClientRect(),d=out.width/r.width,P=placement();return[((e.clientX-r.left)*d-P.ox)/P.s,((e.clientY-r.top)*d-P.oy)/P.s];}
let you=null,ptrDown=false;
stage.addEventListener('pointerdown',e=>{if(view==='3d')return;ptrDown=true;stage.setPointerCapture(e.pointerId);const[x,y]=toFacade(e);
  if(cur.pointer)cur.pointer('down',x,y);else if(you)you.wave=1e9;});
stage.addEventListener('pointermove',e=>{if(view==='3d')return;const[x,y]=toFacade(e);
  if(cur.pointer){cur.pointer(ptrDown?'drag':'move',x,y);return;}
  if(!CROWD.mouse)return;
  if(!you||!CROWD.people.includes(you)){you=crowdAdd({you:true,kid:false,h:1.75,z:1.2,x});}
  you.x=clamp(x,PX0,PX1);you.leave=0;});
stage.addEventListener('pointerup',e=>{ptrDown=false;if(view==='3d')return;const[x,y]=toFacade(e);if(cur.pointer)cur.pointer('up',x,y);else if(you)you.wave=.4;});
stage.addEventListener('pointerleave',()=>{ptrDown=false;if(you)you.leave=.01;if(cur&&cur.pointer)cur.pointer('leave',0,0);});

/* tabs, pitch card and panel */
function buildTabs(){
  const nav=document.getElementById('tabs');nav.innerHTML='';
  for(const id of IDEAS){
    const b=document.createElement('button');b.className='tab';b.role='tab';b.id='tab-'+id.id;b.style.setProperty('--c',id.col);
    b.innerHTML=`<span class="num">${id.n}</span><span class="nm"><b>${esc(L(id.name))}</b><small>${esc(L(id.sub))}</small></span>`;
    b.setAttribute('aria-selected',cur===id);b.addEventListener('click',()=>select(id.id));nav.append(b);
  }
  const vs=document.getElementById('viewseg');vs.innerHTML='';
  for(const[v,l]of VIEWS){const b=document.createElement('button');b.dataset.v=v;b.textContent=L(l);b.addEventListener('click',()=>setView(v));vs.append(b);}
  const sb=document.getElementById('stylebtn');sb.textContent=L({sv:'Stil',en:'Style'});sb.setAttribute('aria-pressed',styleOn);
  sb.onclick=()=>{styleOn=!styleOn;sb.setAttribute('aria-pressed',styleOn);};
  setView(view);
}
function buildPitch(){
  const p=cur.pitch,el=document.getElementById('pitch');el.style.setProperty('--c',cur.col);
  el.innerHTML=`<div><h2>${esc(L(cur.name))}</h2><p class="q">${esc(L(cur.q))}</p><p>${esc(L(p.tagline))}</p>
    <div class="chips">${p.chips.map(([i,l])=>`<span class="chip">${icon(i)}${esc(L(l))}</span>`).join('')}<span class="chip fake">${icon('data')}${esc(L(p.fake))}</span></div></div>
    <div><p class="lbl">${esc(L({sv:'Så funkar det',en:'How it works'}))}</p><ol class="steps">${p.how.map(h=>`<li><span>${esc(L(h))}</span></li>`).join('')}</ol>
    <p class="lbl" style="margin-top:12px">${esc(L({sv:'Fönstren',en:'The windows'}))}</p><p>${esc(L(p.trick))}</p></div>`;
}
function buildPanel(){UI.begin(document.getElementById('ctl'));cur.controls();buildPlazaControls();}
function select(id,keepState){
  const n=IDEAS.find(i=>i.id===id)||IDEAS[0];
  if(cur&&cur.exit)cur.exit();
  cur=n;if(!keepState)cur.init();
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.id==='tab-'+cur.id));
  buildPitch();buildPanel();setTip();
  try{history.replaceState(null,'','#'+cur.id);}catch(e){}
  try{localStorage.setItem('fl-tab',cur.id);}catch(e){}
}
function setLang(l){
  LANG=l;try{localStorage.setItem('fl-lang',l);}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  const t={sub:{sv:'Exploratoriet · 12 rutor · 5 idéer att pitcha',en:'Exploratoriet · 12 panes · 5 ideas to pitch'},'t-ctl':{sv:'Kontroller',en:'Controls'},'t-ctl2':{sv:'webbkontroll för pitchen',en:'web controller for the pitch'},'t-cam':{sv:'Djupkamera',en:'Depth camera'},'t-cam2':{sv:'simulerar 2 × Orbbec',en:'simulates 2 × Orbbec'}};
  for(const k in t)document.getElementById(k).textContent=L(t[k]);
  document.getElementById('fs').setAttribute('aria-label',L({sv:'Helskärm',en:'Fullscreen'}));
  buildTabs();if(cur)select(cur.id,true);
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.l)));
document.getElementById('fs').addEventListener('click',()=>{try{document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen().catch(()=>{});}catch(e){}});

let rafPending=false;
function schedule(){if(!rafPending){rafPending=true;requestAnimationFrame(t=>{rafPending=false;loop(t);});}}
function loop(now){
  const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;const T=(now-T0)/1000;frameNo++;
  if(you&&you.leave>0){you.leave+=dt;if(you.leave>.6){crowdRemove(you);you=null;}}
  if(you&&!CROWD.mouse){crowdRemove(you);you=null;}
  crowdUpdate(dt);
  try{
    cur.update(dt,T);
    clearScr('#000');cur.draw(T);
    if(cur.err){cur.err=null;}
  }catch(e){if(!cur.err){cur.err=e;console.error(e);}g.setTransform(PPM,0,0,PPM,0,0);txt(g,'⚠ '+e.message,F.W/2,F.H/2,.08,{col:'#f55',mono:true});}
  g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.shadowBlur=0;
  present();
  Plaza.draw(T);
  if(frameNo%8===0){const h=cur.hud?cur.hud():'';const el=document.getElementById('hud');if(el.textContent!==h)el.textContent=h;cur.tick&&cur.tick();}
  schedule();
}
/* for headless checks: run n frames by hand when the page is in a hidden tab */
window.__pump=async n=>{for(let i=0;i<n;i++){loop(performance.now());await new Promise(r=>setTimeout(r,16));}};

function boot(){
  setLang(LANG);
  let start=(location.hash||'').slice(1);
  if(!IDEAS.some(i=>i.id===start)){try{start=localStorage.getItem('fl-tab')||'';}catch(e){start='';}}
  select(IDEAS.some(i=>i.id===start)?start:IDEAS[0].id);
  fitOut();last=performance.now();schedule();
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(cur&&h!==cur.id&&IDEAS.some(i=>i.id===h))select(h);});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(boot,boot);

</script>
</body></html>
