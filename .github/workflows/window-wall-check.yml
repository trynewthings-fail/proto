name: Window Wall check

on:
  pull_request:
    paths: ['window-wall/**']
  push:
    branches: [main]
    paths: ['window-wall/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke-test every idea
        run: node window-wall/tools/check.mjs
