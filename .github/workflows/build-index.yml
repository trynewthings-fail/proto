name: Bygg demolistan

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bygg om index.html
        run: python3 tools/build-index.py

      - name: Committa om något ändrats
        run: |
          if git diff --quiet -- index.html; then
            echo "Inget att göra."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Bygg om demolistan"
          git push
